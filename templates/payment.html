<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Insurance Premium Payment</title>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        background: #f5f7fb;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 25px;
        color: #0f172a;
      }

      .payment-wrapper {
        width: 100%;
        max-width: 600px;
      }

      .payment-card {
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 18px;
        padding: 32px;
        box-shadow: 0 15px 40px rgba(15, 23, 42, 0.08);
      }

      .header {
        text-align: center;
        margin-bottom: 28px;
      }

      .icon {
        width: 58px;
        height: 58px;
        margin: 0 auto 14px;

        border-radius: 16px;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #2563eb;
        color: white;

        font-size: 26px;
      }

      .header h1 {
        font-size: 24px;
      }

      .header p {
        margin-top: 5px;
        color: #64748b;
        font-size: 13px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        margin-bottom: 22px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
      }

      .full {
        grid-column: 1 / -1;
      }

      label {
        margin-bottom: 7px;

        color: #475569;

        font-size: 13px;
        font-weight: 600;
      }

      input {
        width: 100%;
        height: 45px;

        border: 1px solid #cbd5e1;
        border-radius: 9px;

        padding: 0 13px;

        font-size: 14px;

        outline: none;
      }

      input:focus {
        border-color: #2563eb;

        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }

      .amount-box {
        background: #eff6ff;

        border: 1px solid #bfdbfe;

        border-radius: 12px;

        padding: 18px;

        margin-bottom: 22px;
      }

      .amount-label {
        color: #64748b;
        font-size: 12px;
      }

      .amount-value {
        margin-top: 5px;

        font-size: 28px;
        font-weight: 700;

        color: #1d4ed8;
      }

      .pay-btn {
        width: 100%;
        height: 48px;

        border: none;
        border-radius: 9px;

        background: #2563eb;
        color: white;

        font-size: 14px;
        font-weight: 700;

        cursor: pointer;
      }

      .pay-btn:hover {
        background: #1d4ed8;
      }

      .pay-btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .message {
        margin-top: 15px;

        text-align: center;

        font-size: 13px;
        font-weight: 600;
      }

      .status-card {
        display: none;

        margin-top: 25px;

        border: 1px solid #e2e8f0;
        border-radius: 12px;

        padding: 20px;

        background: #f8fafc;
      }

      .status-card h3 {
        margin-bottom: 15px;
      }

      .status-row {
        display: flex;
        justify-content: space-between;

        padding: 9px 0;

        border-bottom: 1px solid #e2e8f0;

        font-size: 13px;
      }

      .status-row:last-child {
        border-bottom: none;
      }

      .status-label {
        color: #64748b;
      }

      .status-value {
        font-weight: 600;
        text-align: right;
      }

      .paid {
        color: #15803d;
      }

      .failed {
        color: #dc2626;
      }

      @media (max-width: 600px) {
        .payment-card {
          padding: 22px;
        }

        .form-grid {
          grid-template-columns: 1fr;
        }

        .full {
          grid-column: auto;
        }
      }
    </style>
  </head>

  <body>
    <div class="payment-wrapper">
      <div class="payment-card">
        <div class="header">
          <div class="icon">💳</div>

          <h1>Insurance Premium Payment</h1>

          <p>Secure payment powered by Razorpay</p>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label for="policyId"> Policy ID </label>

            <input
              type="number"
              id="policyId"
              placeholder="Enter policy ID"
              required
            />
          </div>

          <div class="form-group">
            <label for="customerId"> Customer ID </label>

            <input
              type="number"
              id="customerId"
              placeholder="Enter customer ID"
              required
            />
          </div>

          <div class="form-group full">
            <label for="amount"> Premium Amount </label>

            <input
              type="number"
              id="amount"
              placeholder="Enter amount"
              min="1"
              step="0.01"
              value="5000"
              required
              oninput="updateAmount()"
            />
          </div>
        </div>

        <div class="amount-box">
          <div class="amount-label">Amount to Pay</div>

          <div class="amount-value" id="displayAmount">₹5,000.00</div>
        </div>

        <button class="pay-btn" id="payButton" onclick="payNow()">
          Pay Premium
        </button>

        <div id="paymentMessage" class="message"></div>

        <div id="paymentStatus" class="status-card">
          <h3>Payment Details</h3>

          <div class="status-row">
            <span class="status-label"> Status </span>

            <span class="status-value" id="statusText"> - </span>
          </div>

          <div class="status-row">
            <span class="status-label"> Amount </span>

            <span class="status-value" id="amountText"> - </span>
          </div>

          <div class="status-row">
            <span class="status-label"> Payment ID </span>

            <span class="status-value" id="paymentIdText"> - </span>
          </div>

          <div class="status-row">
            <span class="status-label"> Order ID </span>

            <span class="status-value" id="orderIdText"> - </span>
          </div>
        </div>
      </div>
    </div>

    <script>
      /* =========================
   TOKEN
========================= */

      function getToken() {
        const token = localStorage.getItem("token");

        if (!token) {
          window.location.href = "/login";

          return null;
        }

        return token;
      }

      /* =========================
   FORMAT MONEY
========================= */

      function formatMoney(value) {
        const number = Number(value || 0);

        return (
          "₹" +
          number.toLocaleString("en-IN", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          })
        );
      }

      /* =========================
   UPDATE AMOUNT
========================= */

      function updateAmount() {
        const amount = document.getElementById("amount").value;

        document.getElementById("displayAmount").innerText =
          formatMoney(amount);
      }

      /* =========================
   SHOW STATUS
========================= */

      function showPaymentStatus(status, amount, paymentId, orderId) {
        const card = document.getElementById("paymentStatus");

        card.style.display = "block";

        document.getElementById("statusText").innerText = status;

        document.getElementById("amountText").innerText = formatMoney(amount);

        document.getElementById("paymentIdText").innerText = paymentId || "-";

        document.getElementById("orderIdText").innerText = orderId || "-";

        const statusElement = document.getElementById("statusText");

        if (status === "Paid") {
          statusElement.className = "status-value paid";
        } else {
          statusElement.className = "status-value failed";
        }
      }

      /* =========================
   PAY NOW
========================= */

      async function payNow() {
        const token = getToken();

        if (!token) {
          return;
        }

        const policyId = parseInt(document.getElementById("policyId").value);

        const customerId = parseInt(
          document.getElementById("customerId").value,
        );

        const amount = parseFloat(document.getElementById("amount").value);

        const message = document.getElementById("paymentMessage");

        const button = document.getElementById("payButton");

        if (!policyId || !customerId || !amount || amount <= 0) {
          message.innerText = "Please enter valid payment details.";

          message.style.color = "#dc2626";

          return;
        }

        try {
          button.disabled = true;
          button.innerText = "Creating payment order...";

          message.innerText = "";

          /* =========================
           CREATE ORDER
        ========================= */

          const response = await fetch("/payments/create", {
            method: "POST",

            headers: {
              "Content-Type": "application/json",

              Authorization: "Bearer " + token,
            },

            body: JSON.stringify({
              PolicyId: policyId,
              CustomerId: customerId,
              Amount: amount,
            }),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || "Unable to create payment order");
          }

          const order = data.payment;

          /* =========================
           RAZORPAY OPTIONS
        ========================= */

          const options = {
            /*
             * IMPORTANT:
             * This is your current TEST key.
             * Live deployment mein backend/config
             * se public key provide karna better hoga.
             */
            key: "rzp_test_TRCSjivq0FhblR",

            amount: Math.round(Number(order.amount) * 100),

            currency: order.currency,

            name: "Insurance Management System",

            description: "Insurance Premium Payment",

            order_id: order.order_id,

            handler: async function (paymentResponse) {
              try {
                message.innerText = "Verifying payment...";

                message.style.color = "#2563eb";

                /* =========================
                           VERIFY PAYMENT
                        ========================= */

                const verifyResponse = await fetch("/payments/verify", {
                  method: "POST",

                  headers: {
                    "Content-Type": "application/json",

                    Authorization: "Bearer " + token,
                  },

                  body: JSON.stringify({
                    razorpay_order_id: paymentResponse.razorpay_order_id,

                    razorpay_payment_id: paymentResponse.razorpay_payment_id,

                    razorpay_signature: paymentResponse.razorpay_signature,
                  }),
                });

                const result = await verifyResponse.json();

                if (!verifyResponse.ok) {
                  throw new Error(
                    result.error || "Payment verification failed",
                  );
                }

                message.innerText = "Payment successful!";

                message.style.color = "#15803d";

                showPaymentStatus(
                  "Paid",

                  order.amount,

                  paymentResponse.razorpay_payment_id,

                  paymentResponse.razorpay_order_id,
                );
              } catch (error) {
                console.error(error);

                message.innerText =
                  error.message || "Payment verification failed";

                message.style.color = "#dc2626";

                showPaymentStatus(
                  "Verification Failed",

                  order.amount,

                  paymentResponse?.razorpay_payment_id,

                  paymentResponse?.razorpay_order_id,
                );
              }

              button.disabled = false;

              button.innerText = "Pay Premium";
            },

            modal: {
              ondismiss: function () {
                button.disabled = false;

                button.innerText = "Pay Premium";

                message.innerText = "Payment window closed.";

                message.style.color = "#64748b";
              },
            },

            theme: {
              color: "#2563eb",
            },
          };

          /* =========================
           OPEN RAZORPAY
        ========================= */

          const razorpay = new Razorpay(options);

          razorpay.on("payment.failed", function (response) {
            console.error(response.error);

            message.innerText = response.error.description || "Payment failed.";

            message.style.color = "#dc2626";

            showPaymentStatus(
              "Payment Failed",

              order.amount,

              response.error.metadata?.payment_id,

              response.error.metadata?.order_id,
            );

            button.disabled = false;

            button.innerText = "Pay Premium";
          });

          razorpay.open();
        } catch (error) {
          console.error(error);

          message.innerText = error.message || "Payment could not be started.";

          message.style.color = "#dc2626";

          button.disabled = false;

          button.innerText = "Pay Premium";
        }
      }

      updateAmount();
    </script>
  </body>
</html>
