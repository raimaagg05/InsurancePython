<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Insurance Management System</title>

    <style>
      * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        margin: 0;
        background: #f4f6f8;
      }

      .header {
        background: #1f2937;
        color: white;
        padding: 20px 40px;
      }

      .header h1 {
        margin: 0;
      }

      .container {
        padding: 30px 40px;
      }

      .cards {
        display: flex;
        gap: 20px;
        margin-bottom: 30px;
      }

      .card {
        background: white;
        padding: 25px;
        border-radius: 10px;
        width: 220px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      .card h3 {
        margin: 0 0 10px;
        color: #555;
      }

      .card p {
        font-size: 30px;
        margin: 0;
        font-weight: bold;
      }

      .section {
        background: white;
        padding: 25px;
        border-radius: 10px;
        margin-bottom: 25px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 12px;
        border-bottom: 1px solid #ddd;
        text-align: left;
      }

      th {
        background: #f1f3f5;
      }

      .buttons {
        margin-bottom: 20px;
      }

      button {
        padding: 10px 18px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        margin-right: 10px;
      }

      .customer-btn {
        background: #2563eb;
        color: white;
      }

      .policy-btn {
        background: #059669;
        color: white;
      }
    </style>
  </head>

  <body>
    <div class="header">
      <h1>Insurance Policy Management System</h1>
      <p>Customer & Policy Management Dashboard</p>
    </div>

    <div class="container">
      <div class="cards">
        <div class="card">
          <h3>Total Customers</h3>
          <p id="customerCount">0</p>
        </div>

        <div class="card">
          <h3>Total Policies</h3>
          <p id="policyCount">0</p>
        </div>

        <div class="card">
          <h3>Active Policies</h3>
          <p id="activePolicyCount">0</p>
        </div>

        <div class="card">
          <h3>Pending Policies</h3>
          <p id="pendingPolicyCount">0</p>
        </div>
      </div>

      <div class="buttons">
        <button class="customer-btn" onclick="loadCustomers()">
          Load Customers
        </button>

        <button class="policy-btn" onclick="loadPolicies()">
          Load Policies
        </button>
      </div>

      <div class="section">
        <h2>Add New Customer</h2>

        <form id="customerForm">
          <input
            type="text"
            id="customerName"
            placeholder="Customer Name"
            required
          />
          <input type="email" id="customerEmail" placeholder="Email" required />
          <input type="text" id="customerPhone" placeholder="Phone" />

          <input type="text" id="customerAddress" placeholder="Address" />
          <button type="submit" class="customer-btn">Add Customer</button>
        </form>

        <p id="customerMessage"></p>
      </div>

      <div class="section">
        <h2>Add New Policy</h2>

        <form id="policyForm">
          <input
            type="text"
            id="policyNumber"
            placeholder="Policy Number"
            required
          />

          <input
            type="number"
            id="policyCustomerId"
            placeholder="Customer ID"
            required
          />

          <input
            type="text"
            id="policyType"
            placeholder="Policy Type (Health/Life/Motor)"
            required
          />

          <input
            type="number"
            id="premiumAmount"
            placeholder="Premium Amount"
            required
          />

          <input
            type="number"
            id="coverageAmount"
            placeholder="Coverage Amount"
            required
          />

          <label>Effective Date</label>
          <input type="date" id="effectiveDate" required />

          <label>Expiry Date</label>
          <input type="date" id="expiryDate" required />

          <select id="policyStatus">
            <option value="Active">Active</option>
            <option value="Expired">Expired</option>
            <option value="Pending">Pending</option>
          </select>

          <button type="submit" class="policy-btn">Add Policy</button>
        </form>

        <p id="policyMessage"></p>
      </div>

      <div class="section">
        <h2>Customer List</h2>

        <input
          type="text"
          id="customerSearch"
          placeholder="Search customer..."
          onkeyup="searchCustomers()"
        />

        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Address</th>
            </tr>
          </thead>

          <tbody id="customerTable"></tbody>
        </table>
      </div>

      <div class="section">
        <h2>Policy List</h2>

        <table>
          <thead>
            <tr>
              <th>Policy No.</th>
              <th>Customer</th>
              <th>Type</th>
              <th>Premium</th>
              <th>Coverage</th>
              <th>Status</th>
            </tr>
          </thead>

          <tbody id="policyTable"></tbody>
        </table>
      </div>
    </div>

    <script>
      async function loadCustomers() {
        const response = await fetch("/customers");

        const customers = await response.json();

        document.getElementById("customerCount").innerText = customers.length;

        const table = document.getElementById("customerTable");

        table.innerHTML = "";

        customers.forEach((customer) => {
          table.innerHTML += `
            <tr>
                <td>${customer.CustomerId}</td>
                <td>${customer.CustomerName}</td>
                <td>${customer.Email}</td>
                <td>${customer.Phone || ""}</td>
                <td>${customer.Address || ""}</td>
            </tr>
        `;
        });
      }

      async function loadPolicies() {
        const response = await fetch("/policies");

        const policies = await response.json();

        document.getElementById("policyCount").innerText = policies.length;

        const activePolicies = policies.filter(
          (policy) => policy.Status === "Active",
        );

        const pendingPolicies = policies.filter(
          (policy) => policy.Status === "Pending",
        );

        document.getElementById("activePolicyCount").innerText =
          activePolicies.length;

        document.getElementById("pendingPolicyCount").innerText =
          pendingPolicies.length;

        const table = document.getElementById("policyTable");

        table.innerHTML = "";

        policies.forEach((policy) => {
          table.innerHTML += `
            <tr>
                <td>${policy.PolicyNumber}</td>
                <td>${policy.CustomerName}</td>
                <td>${policy.PolicyType}</td>
                <td>₹${policy.PremiumAmount}</td>
                <td>₹${policy.CoverageAmount}</td>
                <td>${policy.Status}</td>
            </tr>
        `;
        });
      }

      document
        .getElementById("customerForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const customer = {
            CustomerName: document.getElementById("customerName").value,
            Email: document.getElementById("customerEmail").value,
            Phone: document.getElementById("customerPhone").value,
            Address: document.getElementById("customerAddress").value,
          };

          const response = await fetch("/customers", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(customer),
          });

          const result = await response.json();

          document.getElementById("customerMessage").innerText =
            result.message || result.error;

          if (response.ok) {
            document.getElementById("customerForm").reset();
            loadCustomers();
          }
        });

      document
        .getElementById("policyForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const policy = {
            PolicyNumber: document.getElementById("policyNumber").value,
            CustomerId: parseInt(
              document.getElementById("policyCustomerId").value,
            ),
            PolicyType: document.getElementById("policyType").value,
            PremiumAmount: parseFloat(
              document.getElementById("premiumAmount").value,
            ),
            CoverageAmount: parseFloat(
              document.getElementById("coverageAmount").value,
            ),
            EffectiveDate: document.getElementById("effectiveDate").value,
            ExpiryDate: document.getElementById("expiryDate").value,
            Status: document.getElementById("policyStatus").value,
          };

          const response = await fetch("/policies", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify(policy),
          });

          const result = await response.json();

          document.getElementById("policyMessage").innerText =
            result.message || result.error;

          if (response.ok) {
            document.getElementById("policyForm").reset();
            loadPolicies();
          }
        });

      function searchCustomers() {
        const searchText = document
          .getElementById("customerSearch")
          .value.toLowerCase();

        const rows = document
          .getElementById("customerTable")
          .getElementsByTagName("tr");

        for (let row of rows) {
          const text = row.innerText.toLowerCase();

          row.style.display = text.includes(searchText) ? "" : "none";
        }
      }
    </script>
  </body>
</html>
