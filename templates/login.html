<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login - InsurePro</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f7fb;
      }

      .login-wrapper {
        width: 100%;
        max-width: 430px;
        padding: 20px;
      }

      .login-card {
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 18px;
        padding: 35px;
        box-shadow: 0 15px 40px rgba(15, 23, 42, 0.08);
      }

      .brand {
        text-align: center;
        margin-bottom: 28px;
      }

      .brand-icon {
        width: 58px;
        height: 58px;
        margin: 0 auto 12px;
        border-radius: 16px;
        background: #2563eb;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
      }

      .brand h1 {
        font-size: 25px;
        color: #0f172a;
      }

      .brand p {
        margin-top: 5px;
        color: #64748b;
        font-size: 13px;
      }

      .form-group {
        margin-bottom: 18px;
      }

      label {
        display: block;
        margin-bottom: 7px;
        color: #334155;
        font-size: 13px;
        font-weight: 600;
      }

      input {
        width: 100%;
        height: 46px;
        padding: 0 14px;
        border: 1px solid #cbd5e1;
        border-radius: 9px;
        font-size: 14px;
        outline: none;
      }

      input:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }

      .login-btn {
        width: 100%;
        height: 46px;
        border: none;
        border-radius: 9px;
        background: #2563eb;
        color: white;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 5px;
      }

      .login-btn:hover {
        background: #1d4ed8;
      }

      .login-btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .message {
        margin-top: 15px;
        text-align: center;
        font-size: 13px;
        font-weight: 600;
      }

      .demo-note {
        margin-top: 22px;
        text-align: center;
        color: #94a3b8;
        font-size: 12px;
      }
    </style>
  </head>

  <body>
    <div class="login-wrapper">
      <div class="login-card">
        <div class="brand">
          <div class="brand-icon">🛡️</div>

          <h1>InsurePro</h1>

          <p>Insurance Management System</p>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="email"> Email Address </label>

            <input
              type="email"
              id="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <div class="form-group">
            <label for="password"> Password </label>

            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              required
            />
          </div>

          <button type="submit" class="login-btn" id="loginButton">
            Login
          </button>
        </form>

        <div id="message" class="message"></div>

        <div class="demo-note">Secure JWT authentication</div>
      </div>
    </div>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async function (event) {
          event.preventDefault();

          const email = document.getElementById("email").value.trim();

          const password = document.getElementById("password").value;

          const button = document.getElementById("loginButton");

          const message = document.getElementById("message");

          button.disabled = true;
          button.innerText = "Logging in...";

          message.innerText = "";

          try {
            const response = await fetch("/auth/login", {
              method: "POST",

              headers: {
                "Content-Type": "application/json",
              },

              body: JSON.stringify({
                Email: email,
                Password: password,
              }),
            });

            const result = await response.json();

            if (!response.ok) {
              message.innerText = result.error || "Login failed.";

              message.style.color = "#dc2626";

              return;
            }

            if (!result.token) {
              message.innerText =
                "Login successful, but token was not received.";

              message.style.color = "#dc2626";

              return;
            }

            /* =========================
               SAVE JWT TOKEN
            ========================= */

            localStorage.setItem("token", result.token);

            /* Save user information */

            if (result.user) {
              localStorage.setItem("user", JSON.stringify(result.user));
            }

            message.innerText = "Login successful. Opening dashboard...";

            message.style.color = "#16a34a";

            setTimeout(function () {
              window.location.href = "/dashboard";
            }, 500);
          } catch (error) {
            console.error(error);

            message.innerText = "Unable to connect to server.";

            message.style.color = "#dc2626";
          } finally {
            button.disabled = false;
            button.innerText = "Login";
          }
        });
    </script>
  </body>
</html>
